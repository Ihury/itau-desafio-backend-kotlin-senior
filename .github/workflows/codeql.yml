name: CodeQL

on:
  push:
    branches: [main, kotlin]
  pull_request:
    branches: [main, kotlin]
  schedule:
    - cron: "30 1 * * 0"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Build manual em vez do autobuild: o autobuild roda `clean` e `testClasses` em invocacoes separadas, sem o source set
      # `integrationTest`, e nao deixa escolher as tarefas. Aqui um unico `./gradlew` faz `clean` (sem reaproveitar saidas
      # em cache, que o CodeQL nao extrairia) e compila main, test e integrationTest. A memoria do Gradle e do compilador
      # Kotlin vem de `gradle.properties` (o padrao de 512 MB estourava com o extrator do CodeQL).
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Build for analysis
        run: ./gradlew clean classes testClasses integrationTestClasses --no-daemon --no-build-cache

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:java-kotlin"
