name: Test & Coverage

on:
  push:
    branches: [main, kotlin]
  pull_request:
    branches: [main, kotlin]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-test:
    name: Unit tests & coverage gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests + coverage gate (./gradlew check)
        run: ./gradlew check --no-daemon

      - name: Upload Jacoco report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: build/reports/jacoco/test
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: build/test-results/test
          retention-days: 7

  integration-test:
    name: Integration tests (DynamoDB Local + Redpanda)
    runs-on: ubuntu-latest
    needs: unit-test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Start DynamoDB Local + Redpanda and seed them
        run: docker compose up -d dynamodb dynamodb-seed redpanda redpanda-seed

      - name: Wait for seed jobs to finish
        run: |
          timeout 60 docker compose wait dynamodb-seed redpanda-seed

      - name: Run integration tests (./gradlew integrationTest)
        run: ./gradlew integrationTest --no-daemon

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down containers
        if: always()
        run: docker compose down --remove-orphans --volumes
