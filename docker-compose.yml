services:
  app:
    build:
      context: .
      target: runtime
    ports:
      - "8080:8080"
      # Gerenciamento (Actuator: health e prometheus). Publicada so no compose local; em producao NAO deve ser roteada pelo balanceador publico.
      - "8082:8082"
    environment:
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      DYNAMODB_REGION: us-east-1
      BALANCE_TABLE_NAME: AccountBalances
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      BALANCE_EVENTS_TOPIC: transacoes-financeiras-processadas
      BALANCE_EVENTS_DLT_TOPIC: transacoes-financeiras-processadas.DLT
      MANAGEMENT_SERVER_PORT: 8082
    # O app so sobe depois que a tabela e os topicos existem (os seeds terminam com sucesso e sao idempotentes).
    depends_on:
      dynamodb:
        condition: service_started
      dynamodb-seed:
        condition: service_completed_successfully
      redpanda:
        condition: service_started
      redpanda-seed:
        condition: service_completed_successfully
    # Maior que os 30 s de `spring.lifecycle.timeout-per-shutdown-phase`: o SIGTERM encerra de forma graciosa antes do SIGKILL.
    stop_grace_period: 40s
    # Prontidao do proprio processo (nunca o DynamoDB; ver ADR-0013). O HEALTHCHECK da imagem e a liveness.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 45s

  dynamodb:
    image: amazon/dynamodb-local:3.3.0
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    working_dir: /home/dynamodblocal
    ports:
      - "8000:8000"

  dynamodb-seed:
    image: amazon/aws-cli:2.36.8
    depends_on:
      - dynamodb
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: us-east-1
      DYNAMODB_ENDPOINT_URL: http://dynamodb:8000
      BALANCE_TABLE_NAME: AccountBalances
    volumes:
      - ./infra/dynamodb:/dynamodb-seed:ro
    entrypoint: ["/bin/bash", "/dynamodb-seed/seed.sh"]

  dynamodb-admin:
    image: aaronshaf/dynamodb-admin:5.3.4
    depends_on:
      - dynamodb
    environment:
      DYNAMO_ENDPOINT: http://dynamodb:8000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      HOST: 0.0.0.0
      PORT: 8001
    ports:
      - "8001:8001"

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.1.14
    hostname: redpanda
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=info
    ports:
      - "19092:19092"

  redpanda-seed:
    image: docker.redpanda.com/redpandadata/redpanda:v26.1.14
    depends_on:
      - redpanda
    environment:
      REDPANDA_BROKERS: redpanda:9092
      BALANCE_EVENTS_TOPIC: transacoes-financeiras-processadas
      BALANCE_EVENTS_DLT_TOPIC: transacoes-financeiras-processadas.DLT
    volumes:
      - ./infra/redpanda:/redpanda-seed:ro
    entrypoint: ["/bin/bash", "-c", "/redpanda-seed/config.sh && /redpanda-seed/seed.sh"]

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v3.9.0
    depends_on:
      - redpanda
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml; /app/console'
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda:9092"]
        schemaRegistry:
          enabled: true
          urls: ["http://redpanda:8081"]
        redpanda:
          adminApi:
            enabled: true
            urls: ["http://redpanda:9644"]
    ports:
      - "8081:8080"
