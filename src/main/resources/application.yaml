server:
  port: ${SERVER_PORT:8080}
  # Encerramento gracioso: a API termina as requisicoes em andamento e cada fase de encerramento espera ate 30 s (docker
  # compose usa `stop_grace_period: 40s`). O consumer para logo apos o registro corrente (`immediate-stop`) e o que nao foi
  # persistido nao e confirmado (commit so pelo container, sem auto-commit): e reentregue e reconciliado pela idempotencia.
  shutdown: graceful

spring:
  application:
    name: consulta-saldo
  lifecycle:
    timeout-per-shutdown-phase: 30s
  # Sem banner: com logs JSON (uma linha = um objeto) o banner ASCII em varias linhas quebraria o parse do coletor de logs.
  main:
    banner-mode: "off"
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:consulta-saldo}
      enable-auto-commit: false
      auto-offset-reset: earliest
      max-poll-records: ${KAFKA_MAX_POLL_RECORDS:100}
      key-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      properties:
        # Invariante verificada por teste: max.poll.records x DYNAMODB_WRITE_CALL_TIMEOUT < max.poll.interval.ms.
        max.poll.interval.ms: ${KAFKA_MAX_POLL_INTERVAL_MS:300000}
        partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor
    # Produtor do DLT: `delivery.timeout.ms`/`request.timeout.ms` curtos fazem a espera de
    # `balance.dlt.wait-for-send-result-timeout` valer de fato (o Spring usaria `delivery.timeout.ms` de 120 s + 5 s); com o DLT
    # ausente a publicacao falha em `max.block.ms`.
    producer:
      key-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: ${KAFKA_DLT_MAX_BLOCK_MS:3000}
        request.timeout.ms: 3000
        delivery.timeout.ms: 4000
    listener:
      ack-mode: batch
      concurrency: ${KAFKA_LISTENER_CONCURRENCY:4}
      immediate-stop: true
      # Lag e tempos do consumer como observacoes Micrometer.
      observation-enabled: true
  mvc:
    problemdetails:
      enabled: true
  # BigDecimal sempre como decimal simples, nunca em notacao cientifica (`1E+3`, `1E-7`).
  jackson:
    write:
      write-bigdecimal-as-plain: true

# Logs JSON nativos do Spring Boot (format `logstash`): o MDC vai como chaves de topo (`correlationId`, `accountId`, `transactionId`).
# Nunca sao logados saldo, titular, payload nem mensagem de parser; ver LoggingPrivacyTest.
logging:
  structured:
    format:
      console: ${LOGGING_STRUCTURED_FORMAT_CONSOLE:logstash}

# Actuator em porta propria: health, info e prometheus nunca respondem na porta da API. Em producao a porta de gerenciamento nao
# deve ser roteada pelo balanceador publico. Os timers de negocio (`balance.*.duration`) declaram os proprios objetivos no codigo,
# junto de cada adapter.
management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8082}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  # `liveness` e `readiness` refletem so o estado do proprio processo e nunca saem de rotacao por causa do DynamoDB; a
  # dependencia fica no grupo `dependencies` (+ gauge `balance.dependency.up`). Use as sondas /actuator/health/liveness e
  # /actuator/health/readiness em balanceador/orquestrador; nao use /actuator/health (raiz), que agrega as dependencias e fica
  # 503 com o DynamoDB fora.
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
        dependencies:
          include: dynamoDb
  metrics:
    distribution:
      slo:
        http.server.requests: 50ms,100ms,300ms,1s,2s

# Cliente DynamoDB. `endpoint` em branco = producao (endpoint AWS e cadeia padrao de credenciais).
dynamodb:
  endpoint: ${DYNAMODB_ENDPOINT:http://localhost:8000}
  region: ${DYNAMODB_REGION:us-east-1}
  table-name: ${BALANCE_TABLE_NAME:AccountBalances}
  connect-timeout: ${DYNAMODB_CONNECT_TIMEOUT:PT0.3S}
  acquire-timeout: ${DYNAMODB_ACQUIRE_TIMEOUT:PT0.3S}
  read:
    consistent: ${DYNAMODB_READ_CONSISTENT:true}
    attempt-timeout: ${DYNAMODB_READ_ATTEMPT_TIMEOUT:PT0.6S}
    call-timeout: ${DYNAMODB_READ_CALL_TIMEOUT:PT1.5S}
    max-attempts: ${DYNAMODB_READ_MAX_ATTEMPTS:2}
    max-connections: ${DYNAMODB_READ_MAX_CONNECTIONS:100}
  # Cliente de escrita (consumer): sem retry no SDK; a unica camada de retry e o error handler do consumer.
  write:
    attempt-timeout: ${DYNAMODB_WRITE_ATTEMPT_TIMEOUT:PT2S}
    call-timeout: ${DYNAMODB_WRITE_CALL_TIMEOUT:PT2S}
    max-connections: ${DYNAMODB_WRITE_MAX_CONNECTIONS:50}

balance:
  events:
    topic: ${BALANCE_EVENTS_TOPIC:transacoes-financeiras-processadas}
    dlt-topic: ${BALANCE_EVENTS_DLT_TOPIC:${BALANCE_EVENTS_TOPIC:transacoes-financeiras-processadas}.DLT}
  dlt:
    wait-for-send-result-timeout: ${BALANCE_DLT_SEND_TIMEOUT:PT5S}
  # Backoff da falha transitoria do armazenamento (multiplicador 2,0 fixo; o container fica pausado durante a espera).
  consumer:
    backoff:
      initial-ms: ${KAFKA_BACKOFF_INITIAL_MS:500}
      max-ms: ${KAFKA_BACKOFF_MAX_MS:30000}
      jitter-ms: ${KAFKA_BACKOFF_JITTER_MS:250}
  # Limites inferiores de plausibilidade dos timestamps do evento.
  min-event-timestamp: ${BALANCE_MIN_EVENT_TIMESTAMP:2000-01-01T00:00:00Z}
  min-account-created-at: ${BALANCE_MIN_ACCOUNT_CREATED_AT:1900-01-01T00:00:00Z}
  # Instante do evento alem de `agora + tolerancia` e `invalid_timestamp`; o relogio so valida, nunca decide precedencia.
  future-tolerance: ${BALANCE_FUTURE_TOLERANCE:PT5M}
  display-zone: ${BALANCE_DISPLAY_ZONE:America/Sao_Paulo}
  # Circuit breaker da leitura. `open-wait` tambem e o valor de `Retry-After` do 503.
  circuit-breaker:
    window: ${BALANCE_CB_WINDOW:PT10S}
    min-calls: ${BALANCE_CB_MIN_CALLS:20}
    failure-rate: ${BALANCE_CB_FAILURE_RATE:50}
    slow-call: ${BALANCE_CB_SLOW_CALL:PT0.5S}
    slow-rate: ${BALANCE_CB_SLOW_RATE:80}
    open-wait: ${BALANCE_CB_OPEN_WAIT:PT10S}
    half-open-calls: ${BALANCE_CB_HALF_OPEN_CALLS:5}
