server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: consulta-saldo
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
  # Erros do framework (404 de rota, 405...) tambem em Problem Details (RFC 9457).
  mvc:
    problemdetails:
      enabled: true
  # BigDecimal sempre como decimal simples, nunca em notacao cientifica (`1E+3`, `1E-7`).
  jackson:
    write:
      write-bigdecimal-as-plain: true

# Cliente DynamoDB (contracts/configuration.md). `endpoint` em branco = producao (endpoint AWS e cadeia padrao de credenciais).
dynamodb:
  endpoint: ${DYNAMODB_ENDPOINT:http://localhost:8000}
  region: ${DYNAMODB_REGION:us-east-1}
  table-name: ${BALANCE_TABLE_NAME:AccountBalances}
  connect-timeout: ${DYNAMODB_CONNECT_TIMEOUT:PT0.3S}
  acquire-timeout: ${DYNAMODB_ACQUIRE_TIMEOUT:PT0.3S}
  read:
    consistent: ${DYNAMODB_READ_CONSISTENT:true}
    attempt-timeout: ${DYNAMODB_READ_ATTEMPT_TIMEOUT:PT0.6S}
    call-timeout: ${DYNAMODB_READ_CALL_TIMEOUT:PT1.5S}
    max-attempts: ${DYNAMODB_READ_MAX_ATTEMPTS:2}
    max-connections: ${DYNAMODB_READ_MAX_CONNECTIONS:100}

# Circuit breaker da leitura (contracts/configuration.md). `open-wait` tambem e o valor de `Retry-After` do 503.
balance:
  display-zone: ${BALANCE_DISPLAY_ZONE:America/Sao_Paulo}
  circuit-breaker:
    window: ${BALANCE_CB_WINDOW:PT10S}
    min-calls: ${BALANCE_CB_MIN_CALLS:20}
    failure-rate: ${BALANCE_CB_FAILURE_RATE:50}
    slow-call: ${BALANCE_CB_SLOW_CALL:PT0.5S}
    slow-rate: ${BALANCE_CB_SLOW_RATE:80}
    open-wait: ${BALANCE_CB_OPEN_WAIT:PT10S}
    half-open-calls: ${BALANCE_CB_HALF_OPEN_CALLS:5}
