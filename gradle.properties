# Memoria explicita para o Gradle e para o compilador Kotlin. Os padroes (512 MB herdados pelo daemon do Kotlin) sao
# insuficientes sob o CodeQL (o extrator Kotlin roda dentro do compilador) e estouravam com "GC overhead limit exceeded".
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m
